<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="100%" height="100%">
  <defs>
    <filter id="washNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="5" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <radialGradient id="skyWashGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#F0F9FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sandWashGrad" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#FFFBEB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="greenWashGrad" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#DCFCE7" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#F0FDF4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Layered Watercolor Washes -->
  <g filter="url(#washNoise)">
    <!-- Sky Blue Painted Splash -->
    <path d="M 120,80 Q 700,-40 1280,60 Q 1380,350 1250,550 Q 700,640 150,580 Q 20,350 120,80 Z" fill="url(#skyWashGrad)" />
    <!-- Warm Gold Sand Splash Left -->
    <path d="M 60,300 Q 400,220 500,500 Q 350,680 100,620 Q -20,480 60,300 Z" fill="url(#sandWashGrad)" />
    <!-- Fresh Sage Green Splash Right -->
    <path d="M 900,280 Q 1350,200 1320,520 Q 1200,690 950,600 Q 800,450 900,280 Z" fill="url(#greenWashGrad)" />
  </g>
</svg>
